const C=document.getElementById('g'),X=C.getContext('2d');
let DPR=1;
function resize() {
    // Cap device-pixel ratio to avoid oversized canvas backing stores on high-DPI laptops.
    DPR=Math.min(window.devicePixelRatio||1,2);
    C.width=Math.max(1,Math.floor(innerWidth*DPR));
    C.height=Math.max(1,Math.floor(innerHeight*DPR));
    C.style.width=innerWidth+'px';
    C.style.height=innerHeight+'px';
    X.setTransform(DPR,0,0,DPR,0,0);

}
resize();
addEventListener('resize',resize);
const W=()=>innerWidth,H=()=>innerHeight;
// Audio synthesis
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio() {
    if(!audioCtx)audioCtx=new AudioCtx()
}
function playSound(freq,dur,type='square',vol=0.1,slide=0) {
    if(!audioCtx)return;
    try {
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type;
        o.frequency.setValueAtTime(freq,audioCtx.currentTime);
        if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),audioCtx.currentTime+dur);
        g.gain.setValueAtTime(vol,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime+dur);

    }catch(e) {

    }
}
function sfxShoot() {
    playSound(800,0.08,'square',0.06,-400)
}
function sfxHit() {
    playSound(200,0.15,'sawtooth',0.08,100)
}
function sfxExplode() {
    playSound(80,0.3,'sawtooth',0.12,-60);
    playSound(150,0.2,'square',0.06,-100)
}
function sfxRicochet() {
    playSound(1200,0.12,'sine',0.08,-600)
}
function sfxPickup() {
    playSound(600,0.1,'sine',0.08,400);
    setTimeout(()=>playSound(900,0.1,'sine',0.06,200),60)
}
function sfxDash() {
    playSound(400,0.15,'sawtooth',0.05,300)
}
function sfxLevelUp() {
    playSound(400,0.15,'sine',0.08,200);
    setTimeout(()=>playSound(600,0.15,'sine',0.08,200),100);
    setTimeout(()=>playSound(800,0.2,'sine',0.08,200),200)
}
function sfxGameOver() {
    playSound(300,0.4,'sawtooth',0.1,-200);
    setTimeout(()=>playSound(150,0.5,'sawtooth',0.1,-100),200)
}
const ST= {

let upgradeChoices=[],upgradeReturnState=ST.PLAY,bossLevelSpawned=0,slowMo=0,ghostPath=[],ghostTimer=0,lastKillWasRicochet=false,offeredUpgradeIds=[];
let shake= {

try { playerName=(localStorage.getItem('vrPlayerName')||'').trim().slice(0,18); } catch(e) {}

function confirmPlayerName(value) {

}
document.getElementById('nameCard').addEventListener('submit',e=>{e.preventDefault();confirmPlayerName(playerNameInput.value);});
// Use a fresh leaderboard key so sample/demo scores from earlier versions are not shown.
let hiScores=[];
try {

    hiScores=Array.isArray(savedScores)?savedScores.filter(s=>s&&Number.isFinite(Number(s.s))).map(s=>( {

// Pools
let P,bullets,enemies,parts,pickups,refs,gwells,stars,ftexts,bgParts;
const keys= {

};

// Selectable planetary environments. The selected theme is used in both the homepage preview and gameplay.
const PLANET_THEMES=[
 {name:'EARTH',sub:'BLUE MARBLE',base:'#020b19',glow:'#1678a8',land:'#32865c',accent:'#68d8ff',kind:'earth'},
 {name:'MOON',sub:'LUNAR SURFACE',base:'#080a13',glow:'#747b8b',land:'#a6acb8',accent:'#d9e0ed',kind:'moon'},
 {name:'MARS',sub:'RED PLANET',base:'#160806',glow:'#a84427',land:'#d66b43',accent:'#ffad78',kind:'mars'},
 {name:'SATURN',sub:'RINGED GIANT',base:'#110c08',glow:'#b78b4b',land:'#d4b77b',accent:'#ffe0a0',kind:'saturn'},
 {name:'NEPTUNE',sub:'ICE GIANT',base:'#030820',glow:'#315fe2',land:'#3a8dff',accent:'#8de7ff',kind:'neptune'},
 {name:'EUROPA',sub:'FROZEN OCEAN',base:'#07131b',glow:'#4b9a9a',land:'#b2d8cf',accent:'#d5fff1',kind:'europa'}
];
let selectedPlanet=0;
function planetButtonLayout(){
 const gap=8, total=Math.min(W()-24,690), cardW=Math.min(108,(total-gap*5)/6), all=cardW*6+gap*5;
 return {cardW,gap,start:(W()-all)/2,y:H()*.425};
}
function planetButtonAt(px,py){
 const l=planetButtonLayout();
 for(let i=0;i<PLANET_THEMES.length;i++){const x=l.start+i*(l.cardW+l.gap);if(px>=x&&px<=x+l.cardW&&py>=l.y-28&&py<=l.y+38)return i;}
 return -1;
}
function drawPlanetBackdrop(){
 const t=PLANET_THEMES[selectedPlanet];
 X.fillStyle=t.base;X.fillRect(0,0,W(),H());
 // Diffuse atmospheric light
 const gx=W()*.78,gy=H()*.54,gr=X.createRadialGradient(gx,gy,5,gx,gy,Math.max(W(),H())*.72);
 gr.addColorStop(0,t.glow+'44');gr.addColorStop(.45,t.glow+'18');gr.addColorStop(1,'rgba(0,0,0,0)');
 X.fillStyle=gr;X.fillRect(0,0,W(),H());
 // Large planetary body with procedural surface detail (no external image assets required).
 const r=Math.min(W(),H())*.34,cx=W()*.82,cy=H()*.56;
 if(t.kind==='saturn'){
  X.save();X.translate(cx,cy);X.rotate(-.22);X.strokeStyle=t.accent+'55';X.lineWidth=Math.max(8,r*.13);X.beginPath();X.ellipse(0,0,r*1.55,r*.42,0,0,Math.PI*2);X.stroke();X.strokeStyle=t.accent+'22';X.lineWidth=Math.max(3,r*.05);X.beginPath();X.ellipse(0,0,r*1.75,r*.5,0,0,Math.PI*2);X.stroke();X.restore();
 }
 const pg=X.createRadialGradient(cx-r*.35,cy-r*.38,r*.05,cx,cy,r*1.1);
 pg.addColorStop(0,t.accent);pg.addColorStop(.38,t.glow);pg.addColorStop(1,t.base);
 X.save();X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.clip();X.fillStyle=pg;X.fillRect(cx-r,cy-r,2*r,2*r);
 for(let i=0;i<18;i++){
  const xx=cx+(Math.sin(i*12.37)*.78)*r, yy=cy+(Math.cos(i*7.91)*.78)*r;
  const rr=(.025+(i%4)*.012)*r;
  X.globalAlpha=t.kind==='moon'?.17:.13;X.fillStyle=t.kind==='earth'?(i%2?'#59b76d':'#b3e8ff'):t.land;
  X.beginPath();X.ellipse(xx,yy,rr*1.7,rr*(t.kind==='mars'?1.8:.8),i*.7,0,Math.PI*2);X.fill();
 }
 if(t.kind==='earth'){
  X.globalAlpha=.24;X.strokeStyle='#d6f8ff';X.lineWidth=2;
  for(let j=-2;j<=2;j++){X.beginPath();X.ellipse(cx,cy,r*.95,r*(.25+Math.abs(j)*.13),0,0,Math.PI*2);X.stroke();}
 } else if(t.kind==='moon'){
  for(let i=0;i<13;i++){const xx=cx+Math.sin(i*8.1)*r*.7,yy=cy+Math.cos(i*5.2)*r*.7,rr=r*(.025+(i%3)*.018);X.globalAlpha=.18;X.strokeStyle='#171c29';X.lineWidth=3;X.beginPath();X.arc(xx,yy,rr,0,Math.PI*2);X.stroke();}
 } else if(t.kind==='mars'){
  X.globalAlpha=.2;X.strokeStyle='#4e1a12';X.lineWidth=3;for(let i=0;i<6;i++){X.beginPath();X.moveTo(cx-r,cy-r*.5+i*r*.18);X.bezierCurveTo(cx-r*.3,cy-r*.8+i*r*.15,cx+r*.2,cy+r*.5+i*r*.1,cx+r,cy+r*.1+i*r*.12);X.stroke();}
 } else if(t.kind==='europa'){
  X.globalAlpha=.32;X.strokeStyle='#e1fff7';X.lineWidth=2;for(let i=0;i<11;i++){X.beginPath();let xx=cx+Math.sin(i*4.7)*r*.85,yy=cy+Math.cos(i*6.3)*r*.8;X.moveTo(xx,yy);X.lineTo(xx+Math.sin(i)*r*.18,yy+Math.cos(i*2)*r*.3);X.stroke();}
 }
 X.restore();X.globalAlpha=1;
 // Soft terminator and subtle rim light
 X.strokeStyle=t.accent+'55';X.lineWidth=2;X.beginPath();X.arc(cx,cy,r,Math.PI*.62,Math.PI*1.6);X.stroke();
}

function initStars() {
    stars=[];
    for(let i=0;i<300;i++)stars.push( {
        x:Math.random()*2000-500,y:Math.random()*2000-500,s:Math.random()*2+.3,sp:Math.random()*.5+.1,b:Math.random(),tw:Math.random()*2+1,h:180+Math.random()*60
    });
    bgParts=[];

}
function mkPlayer() {
    return {
        x:W()/2,y:H()/2,vx:0,vy:0,r:15,a:0,hp:100,mhp:100,sh:0,fr:7,fc:0,inv:0,trail:[],wl:1,rc:1,dc:0,dt:0,dash:false,xp:0,nextLv:500,energy:100,maxE:100,eRegen:.15
    };

}
function spawnEnemy() {
    const types=['chase','shoot','orbit','split','geo','swarm'];
    let avail=['chase'];
    if(level>=2)avail.push('shoot');
    if(level>=3)avail.push('orbit','swarm');
    if(level>=4)avail.push('split');
    if(level>=6)avail.push('geo');
    const type=avail[Math.random()*avail.length|0];
    const side=Math.random()*4|0;
    let x,y;
    if(side===0) {
        x=-40;
        y=Math.random()*H()
    }else if(side===1) {
        x=W()+40;
        y=Math.random()*H()
    }else if(side===2) {
        x=Math.random()*W();
        y=-40
    }else {
        x=Math.random()*W();
        y=H()+40
    }
    const bhp=1+Math.floor(level/3);
    const e= {
        x,y,vx:0,vy:0,r:16,type,hp:bhp,mhp:bhp,a:Math.random()*6.28,rs:(Math.random()-.5)*.06,fc:0,oa:Math.random()*6.28,or:140+Math.random()*100,verts:3,fl:0,sc:0,speed:1.5,fireRate:90,spawnT:30,age:0,pulsePhase:Math.random()*6.28
    };
    switch(type) {
        case'chase':e.speed=1.8+level*.18;
        e.r=13;
        e.verts=3;
        break;
        case'shoot':e.speed=.9+level*.1;
        e.r=16;
        e.fireRate=Math.max(40,85-level*4);
        e.verts=4;
        e.hp=bhp+1;
        e.mhp=e.hp;
        break;
        case'orbit':e.speed=2.2+level*.1;
        e.r=11;
        e.verts=6;
        break;
        case'split':e.speed=1.3+level*.1;
        e.r=24;
        e.hp=bhp+2;
        e.mhp=e.hp;
        e.verts=5;
        break;
        case'geo':e.speed=.6+level*.06;
        e.r=22;
        e.hp=bhp+4;
        e.mhp=e.hp;
        e.verts=8;
        e.rs=.025;
        break;
        case'swarm':e.speed=2.5+level*.15;
        e.r=8;
        e.verts=3;
        e.hp=1;
        e.mhp=1;
        break;

    }
    enemies.push(e);

}
function spawnMini(x,y) {
    const a=Math.random()*6.28,sp=2.5+Math.random();
    enemies.push( {
        x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:9,type:'mini',hp:1,mhp:1,a:Math.random()*6.28,rs:.12,speed:sp,verts:3,fl:0,sc:0,fc:999,oa:0,or:0,fireRate:999,spawnT:15,age:0,pulsePhase:Math.random()*6.28
    });

}
function spawnRef() {
    const marginX=Math.min(100,W()/2),marginY=Math.min(100,H()/2);
    const x=marginX+Math.random()*Math.max(0,W()-marginX*2),y=marginY+Math.random()*Math.max(0,H()-marginY*2);

    });

function spawnGW() {
    const marginX=Math.min(120,W()/2),marginY=Math.min(120,H()/2);
    const x=marginX+Math.random()*Math.max(0,W()-marginX*2),y=marginY+Math.random()*Math.max(0,H()-marginY*2);

    });
    if(gwells.length>3)gwells.shift();

}
function spawnPickup(x,y) {
    const ts=['hp','sh','wpn','ric','pts','energy'];
    const w=[3,2,2,2,4,2];
    let t=w.reduce((a,b)=>a+b),r=Math.random()*t,type=ts[0];
    for(let i=0;i<w.length;i++) {
        r-=w[i];
        if(r<=0) {
            type=ts[i];
            break
        }
    }
    pickups.push( {
        x,y,type,r:12,life:500,ml:500,a:0,p:0,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,magnet:false
    });

}
function fire() {
    if(P.fc>0||P.energy<5)return;
    runStats.shots++;
    const sp=12,c=Math.cos(P.a),s=Math.sin(P.a);
    const mk=(ang,off=0)=> {
        const ox=Math.cos(P.a+1.57)*off;
        const oy=Math.sin(P.a+1.57)*off;
        bullets.push( {
            x:P.x+c*22+ox,y:P.y+s*22+oy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:3.5,dmg:(P.damage||1),rl:P.rc,life:200,trail:[],own:'p',pierce:P.wl>=3,hue:25,age:0,bounces:0
        });

    };
    mk(P.a);
    if(P.wl>=2) {
        mk(P.a-.1,-7);
        mk(P.a+.1,7)
    }
    if(P.wl>=3) {
        mk(P.a-.22,-14);
        mk(P.a+.22,14)
    }
    P.fc=P.fr;
    P.energy=Math.max(0,P.energy-3);
    sfxShoot();
    for(let i=0;i<6;i++) {
        parts.push( {
            x:P.x+c*22,y:P.y+s*22,vx:c*(4+Math.random()*4)+(Math.random()-.5)*2,vy:s*(4+Math.random()*4)+(Math.random()-.5)*2,life:12+Math.random()*10,ml:22,sz:2+Math.random()*3,color:`hsl(${185+Math.random()*30},100%,${65+Math.random()*35}%)`,type:'spark'
        })
    }
}

    bullets.push( {
        x:e.x+Math.cos(a)*e.r,y:e.y+Math.sin(a)*e.r,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:4,dmg:12,rl:0,life:200,trail:[],own:'e',pierce:false,hue:0,age:0

function boom(x,y,n,c,sp=5) {
    for(let i=0;i<n;i++) {
        const a=(6.28/n)*i+Math.random()*.5,s=sp*(.5+Math.random());

        });

    }
}
function geoBoom(x,y,v,r,c) {
    for(let i=0;i<v;i++) {
        const a1=(6.28/v)*i,a2=(6.28/v)*((i+1)%v);
        const mx2=(Math.cos(a1)+Math.cos(a2))/2*r+x;
        const my2=(Math.sin(a1)+Math.sin(a2))/2*r+y;
        const ang=Math.atan2(my2-y,mx2-x),sp=3+Math.random()*4;
        parts.push( {
            x:mx2,y:my2,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:35+Math.random()*20,ml:55,sz:r*.6,color:c,type:'line',a:a1,len:r*2*Math.sin(Math.PI/v),rs:(Math.random()-.5)*.2
        });

    }
    // Shockwave
    parts.push( {
        x,y,vx:0,vy:0,life:20,ml:20,sz:r,color:c,type:'ring',maxR:r*5
    });

}
function reflect(b,ref) {
    const nx=Math.cos(ref.a+1.57),ny=Math.sin(ref.a+1.57);
    const dot=b.vx*nx+b.vy*ny;
    b.vx-=2*dot*nx;
    b.vy-=2*dot*ny;
    const sp=Math.hypot(b.vx,b.vy)*1.2;
    b.vx=(b.vx/Math.hypot(b.vx,b.vy))*sp;
    b.vy=(b.vy/Math.hypot(b.vx,b.vy))*sp;
    b.rl--;
    b.dmg*=1.8;
    b.hue+=30;
    b.r=Math.min(8,b.r*1.15);
    for(let i=0;i<12;i++) {
        const a=Math.atan2(b.vy,b.vx)+(Math.random()-.5)*Math.PI;
        const s=2+Math.random()*5;
        parts.push( {

function ptSegDist(px,py,x1,y1,x2,y2) {
    const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
    let t=((px-x1)*dx+(py-y1)*dy)/l2;
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));

}
function dist(a,b) {
    return Math.hypot(a.x-b.x,a.y-b.y)
}
function colCirc(a,b) {

function offerUpgrades(){
    // Avoid recently offered choices. Once the available variety runs low, recycle the pool.
    let pool=UPGRADE_POOL.filter(u=>!offeredUpgradeIds.includes(u.id));
    if(pool.length<3){offeredUpgradeIds=[];pool=[...UPGRADE_POOL];}
    upgradeChoices=[];
    while(upgradeChoices.length<3&&pool.length){const i=Math.random()*pool.length|0;const choice=pool.splice(i,1)[0];upgradeChoices.push(choice);offeredUpgradeIds.push(choice.id);}
    if(offeredUpgradeIds.length>UPGRADE_POOL.length-3)offeredUpgradeIds=offeredUpgradeIds.slice(-Math.max(0,UPGRADE_POOL.length-3));
    upgradeReturnState=ST.PLAY; gs=ST.UPGRADE;
}

function checkLevel() {

// Update
function updateP() {
    let mvx=0,mvy=0;
    const sp=P.dash?12*(1+(P.dashBonus||0)):5;
    if(keys.KeyW||keys.ArrowUp)mvy=-1;
    if(keys.KeyS||keys.ArrowDown)mvy=1;
    if(keys.KeyA||keys.ArrowLeft)mvx=-1;
    if(keys.KeyD||keys.ArrowRight)mvx=1;
    if(vj.on) {
        const jd=Math.hypot(vj.dx,vj.dy);
        if(jd>5) {
            mvx=vj.dx/55;
            mvy=vj.dy/55
        }
    }
    const ml=Math.hypot(mvx,mvy);
    if(ml>0) {
        mvx/=ml;
        mvy/=ml
    }
    P.vx+=mvx*sp*.35;
    P.vy+=mvy*sp*.35;
    P.vx*=.87;
    P.vy*=.87;
    for(const g of gwells) {
        const dx=g.x-P.x,dy=g.y-P.y,d=Math.hypot(dx,dy);
        if(d>20&&d<300) {
            const f=g.str/(d*d)*.4;
            P.vx+=(dx/d)*f;
            P.vy+=(dy/d)*f
        }
    }
    P.x+=P.vx;
    P.y+=P.vy;
    P.x=Math.max(P.r,Math.min(W()-P.r,P.x));
    P.y=Math.max(P.r,Math.min(H()-P.r,P.y));
    if(!isMob||touchAim||mdown)P.a=Math.atan2(my-P.y,mx-P.x);
    else if(ml>.1)P.a=Math.atan2(mvy,mvx);
    if(P.fc>0)P.fc--;
    P.energy=Math.min(P.maxE,P.energy+P.eRegen);
    if(mdown||keys.Space)fire();
    if(P.dt>0) {
        P.dt--;
        if(P.dt<=0)P.dash=false
    }
    if(P.dc>0)P.dc--;
    if(P.inv>0)P.inv--;
    P.trail.push( {
        x:P.x,y:P.y,a:P.a
    });
    if(P.trail.length>20)P.trail.shift();
    if(Math.hypot(P.vx,P.vy)>2&&Math.random()<.4) {
        const trailA=P.a+Math.PI;
        const trailSpeed=1.2+Math.random()*2.2;
        parts.push( {
            x:P.x+Math.cos(trailA)*10+(Math.random()-.5)*5,
            y:P.y+Math.sin(trailA)*10+(Math.random()-.5)*5,
            vx:Math.cos(trailA)*trailSpeed-P.vx*.15+(Math.random()-.5),
            vy:Math.sin(trailA)*trailSpeed-P.vy*.15+(Math.random()-.5),
            life:18+Math.random()*16,ml:34,sz:1.5+Math.random()*3,
            color:P.dash?'#fff4b0':`hsl(${Math.random()*25+18},100%,${55+Math.random()*25}%)`,type:'spark'
        });

    }
    // Engine particles
    const ea=P.a+Math.PI;
    if(ml>.1||Math.hypot(P.vx,P.vy)>1) {
        parts.push( {
            x:P.x+Math.cos(ea)*12,y:P.y+Math.sin(ea)*12,vx:Math.cos(ea)*(2+Math.random()*2)+(Math.random()-.5),vy:Math.sin(ea)*(2+Math.random()*2)+(Math.random()-.5),life:10+Math.random()*8,ml:18,sz:2+Math.random()*2,color:`hsl(${Math.random()*25+18},100%,${60+Math.random()*25}%)`,type:'spark'
        });

    }
}
function updateE() {
    for(let i=enemies.length-1;i>=0;i--) {
        const e=enemies[i];
        e.age++;
        if(e.sc<1) {
            e.sc=Math.min(1,e.sc+.06);
            continue
        }
        if(e.fl>0)e.fl--;
        e.a+=e.rs;
        e.pulsePhase+=.05;
        switch(e.type) {
            case'chase':case'mini':case'swarm': {
                const a=Math.atan2(P.y-e.y,P.x-e.x);
                e.vx+=Math.cos(a)*e.speed*.06;
                e.vy+=Math.sin(a)*e.speed*.06;
                const s=Math.hypot(e.vx,e.vy);
                if(s>e.speed) {
                    e.vx=(e.vx/s)*e.speed;
                    e.vy=(e.vy/s)*e.speed
                }
                break;

            }
            case'shoot': {
                const a=Math.atan2(P.y-e.y,P.x-e.x),d=dist(e,P);
                if(d>220) {
                    e.vx+=Math.cos(a)*e.speed*.04;
                    e.vy+=Math.sin(a)*e.speed*.04
                }else if(d<160) {
                    e.vx-=Math.cos(a)*e.speed*.04;
                    e.vy-=Math.sin(a)*e.speed*.04
                }
                // Strafe
                e.vx+=Math.cos(a+1.57)*Math.sin(gt*.02+e.pulsePhase)*.3;
                e.vy+=Math.sin(a+1.57)*Math.sin(gt*.02+e.pulsePhase)*.3;
                e.vx*=.97;
                e.vy*=.97;
                e.fc--;
                if(e.fc<=0) {
                    fireEnemy(e);
                    e.fc=e.fireRate
                }
                break;

            }
            case'orbit': {
                e.oa+=.025;
                const tx=P.x+Math.cos(e.oa)*e.or,ty=P.y+Math.sin(e.oa)*e.or;
                e.vx+=(tx-e.x)*.025;
                e.vy+=(ty-e.y)*.025;
                e.vx*=.94;
                e.vy*=.94;
                break;

            }
            case'boss': {
                const tx=W()/2+Math.sin(gt*.012)*W()*.28, ty=H()*.24+Math.sin(gt*.021)*35;
                e.vx+=(tx-e.x)*.012; e.vy+=(ty-e.y)*.012; e.vx*=.96; e.vy*=.96;
                e.fc--; if(e.fc<=0){ const base=Math.atan2(P.y-e.y,P.x-e.x); for(let k=-1;k<=1;k++){const a=base+k*.22;bullets.push({x:e.x+Math.cos(a)*e.r,y:e.y+Math.sin(a)*e.r,vx:Math.cos(a)*4.2,vy:Math.sin(a)*4.2,r:5,dmg:14,rl:0,life:180,trail:[],own:'e',pierce:false,hue:0,age:0});} e.fc=e.fireRate; }
                break;
            }
            case'split':case'geo': {
                const a=Math.atan2(P.y-e.y,P.x-e.x);
                e.vx+=Math.cos(a)*e.speed*.025;
                e.vy+=Math.sin(a)*e.speed*.025;
                e.vx*=.97;
                e.vy*=.97;
                break;

            }
        }
        for(const g of gwells) {
            const dx=g.x-e.x,dy=g.y-e.y,d=Math.hypot(dx,dy);
            if(d>20&&d<300) {
                const f=g.str/(d*d)*.25;
                e.vx+=(dx/d)*f;
                e.vy+=(dy/d)*f
            }
        }
        e.x+=e.vx;
        e.y+=e.vy;

            }else {

function updateB() {
    for(let i=bullets.length-1;i>=0;i--) {
        const b=bullets[i];
        b.age++;
        for(const g of gwells) {
            const dx=g.x-b.x,dy=g.y-b.y,d=Math.hypot(dx,dy);
            if(d>10&&d<250) {
                const f=g.str/(d*d)*.7;
                b.vx+=(dx/d)*f;
                b.vy+=(dy/d)*f
            }
        }
        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;
        b.trail.push( {
            x:b.x,y:b.y
        });
        if(b.trail.length>10)b.trail.shift();
        if(b.own==='p'&&b.rl>0) {
            if(b.x<0||b.x>W()) {
                b.vx*=-1;
                b.rl--;
                b.bounces=(b.bounces||0)+1; runStats.bounces++;
                b.dmg*=1.4;
                addShake(3,4);
                boom(b.x,b.y,6,'#0ff',2);
                sfxRicochet();
                b.hue+=25
            }
            if(b.y<0||b.y>H()) {
                b.vy*=-1;
                b.rl--;
                b.bounces=(b.bounces||0)+1; runStats.bounces++;
                b.dmg*=1.4;
                addShake(3,4);
                boom(b.x,b.y,6,'#0ff',2);
                sfxRicochet();
                b.hue+=25
            }
            for(const ref of refs) {
                const rx1=ref.x+Math.cos(ref.a)*ref.l/2,ry1=ref.y+Math.sin(ref.a)*ref.l/2;
                const rx2=ref.x-Math.cos(ref.a)*ref.l/2,ry2=ref.y-Math.sin(ref.a)*ref.l/2;
                if(ptSegDist(b.x,b.y,rx1,ry1,rx2,ry2)<b.r+5) {
                    reflect(b,ref);
                    break
                }
            }
        }
        if(b.own==='p') {
            for(let j=enemies.length-1;j>=0;j--) {
                const e=enemies[j];
                if(e.sc<1)continue;
                if(colCirc(b,e)) {
                    e.hp-=b.dmg;
                    e.fl=10;
                    sfxHit();
                    const a=Math.atan2(e.y-b.y,e.x-b.x);
                    e.vx+=Math.cos(a)*2.5;
                    e.vy+=Math.sin(a)*2.5;
                    boom(b.x,b.y,6,`hsl(${b.hue},100%,70%)`,2);
                    if(e.hp<=0) {
                        if((b.bounces||0)>0){ghostPath=b.trail.map(pt=>({x:pt.x,y:pt.y}));ghostPath.push({x:b.x,y:b.y});ghostTimer=55;slowMo=5;}
                        lastKillWasRicochet=(b.bounces||0)>0;
                        killEnemy(e);
                        enemies.splice(j,1)
                    }
                    if(!b.pierce) {
                        bullets.splice(i,1);
                        break
                    }
                }
            }
        }else {
            if(colCirc(b,P)) {
                dmgPlayer(b.dmg);
                bullets.splice(i,1);
                continue
            }
        }
        if(i<bullets.length&&(b.life<=0||(b.rl<=0&&(b.x<-60||b.x>W()+60||b.y<-60||b.y>H()+60))))bullets.splice(i,1);

    }
}
function updateParts() {
    for(let i=parts.length-1;i>=0;i--) {
        const p=parts[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vx*=.95;
        p.vy*=.95;
        p.life--;
        if(p.type==='line')p.a+=p.rs;
        if(p.type==='ring')p.sz+=(p.maxR-p.sz)*.15;
        if(p.life<=0)parts.splice(i,1);

    }
    if(parts.length>600)parts.splice(0,parts.length-600);

}
function updatePicks() {
    for(let i=pickups.length-1;i>=0;i--) {
        const p=pickups[i];
        p.life--;
        p.a+=.04;
        p.p+=.08;
        p.x+=p.vx;
        p.y+=p.vy;
        p.vx*=.97;
        p.vy*=.97;
        // Magnet effect when close
        const d=dist(p,P);
        const magnetRange=120+(P.pickupRange||0);
        if(d<magnetRange) {
            const a=Math.atan2(P.y-p.y,P.x-p.x);
            const f=Math.max(0,(magnetRange-d)/magnetRange)*3;
            p.vx+=Math.cos(a)*f*.3;
            p.vy+=Math.sin(a)*f*.3;

        }
        if(p.life<=0) {
            pickups.splice(i,1);
            continue
        }
        if(d<p.r+P.r+8) {
            applyPickup(p);
            pickups.splice(i,1)
        }
    }
}
function updateFT() {
    for(let i=ftexts.length-1;i>=0;i--) {

        t.y+=t.vy;

    if(ghostTimer>0)ghostTimer--; else ghostPath=[];

        comboT--;
        if(comboT<=0)combo=0
    }

    }
    for(let i=gwells.length-1;i>=0;i--) {

    }

    if(Math.random()<.05) {
        bgParts.push( {
            x:Math.random()*W(),y:-10,vy:.5+Math.random(),life:H()+20,s:1+Math.random()*2,h:180+Math.random()*60
        });

    }
    for(let i=bgParts.length-1;i>=0;i--) {
        bgParts[i].y+=bgParts[i].vy;
        bgParts[i].life--;
        if(bgParts[i].life<=0)bgParts.splice(i,1);

    }
}
// Drawing
function poly(x,y,r,n,a,fill,stroke,lw=2) {
    X.beginPath();
    for(let i=0;i<=n;i++) {
        const ang=a+(6.28/n)*i;
        const px=x+Math.cos(ang)*r,py=y+Math.sin(ang)*r;
        i?X.lineTo(px,py):X.moveTo(px,py)
    }
    X.closePath();
    if(fill) {
        X.fillStyle=fill;
        X.fill()
    }
    if(stroke) {
        X.strokeStyle=stroke;
        X.lineWidth=lw;
        X.stroke()
    }
}

        X.fillStyle=rc[rank-1];
        X.shadowColor=rc[rank-1];
        X.shadowBlur=10;
        X.font=`bold ${Math.min(22,W()*.035)}px Courier New`;
        X.fillText(`★ #${rank} HIGH SCORE! ★`,W()/2,H()*.56);
        X.shadowBlur=0;

    }
    // Top scores
    X.fillStyle='#667';
    X.font=`${Math.min(11,W()*.018)}px Courier New`;
    X.fillText(`KILLS ${runStats.kills}  ·  BANK SHOTS ${runStats.ricochetKills}  ·  BOUNCES ${runStats.bounces}`,W()/2,H()*.62);
    X.fillText(`SHOTS ${runStats.shots}  ·  TIME ${Math.floor((Date.now()-(runStats.startTime||Date.now()))/1000)}s`,W()/2,H()*.645);
    X.fillText('─── TOP SCORES ───',W()/2,H()*.68);
    hiScores.slice(0,5).forEach((s,i)=> {
        const hi=s.s===score;X.fillStyle=hi?'#0ff':i<3?['#ff0','#ccc','#c84'][i]:'#556';X.font=`${hi?'bold ':''}${Math.min(13,W()*.02)}px Courier New`;X.fillText(`${(i+1)}. ${(s.n||'').slice(0,12).padEnd(12,' ')} ${s.s.toString().padStart(8,'0')}  LV${s.l}`,W()/2,H()*.715+i*17);
    });
    const pulse=Math.sin(menuT*3.5)*.3+.7;
    X.globalAlpha=pulse;
    drawActionButton(isMob?'RESTART':'ENTER TO RESTART',W()/2-100,H()*.88,190,40,'#0ff');
    X.globalAlpha=1;
    drawActionButton('HOMEPAGE',W()/2+115,H()*.88,150,40,'#ffb347');

}
function drawScores() {
    menuT+=.016;
    drawBG();
    drawGrid();
    X.fillStyle='#0ff';
    X.shadowColor='#0ff';
    X.shadowBlur=20;
    X.font='bold 32px Courier New';
    X.textAlign='center';
    X.fillText('★ HIGH SCORES ★',W()/2,55);
    X.shadowBlur=0;
    if(!hiScores.length) {
        X.fillStyle='#667';
        X.font='16px Courier New';
        X.fillText('NO SCORES YET',W()/2,H()/2);
        X.fillText('GO PLAY!',W()/2,H()/2+25);

    }else {
        hiScores.slice(0,10).forEach((s,i)=> {
            const rc=['#ff0','#ccc','#c84'];X.fillStyle=i<3?rc[i]:'#889';X.font=`${i<3?'bold ':''}${Math.min(16,W()*.025)}px Courier New`;X.textAlign='center';const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':` ${i+1}.`;X.fillText(`${medal} ${(s.n||'').slice(0,16)}  ${s.s.toString().padStart(8,'0')}  LV ${(s.l||'?')}`,W()/2,110+i*35);
        });

    }
    const pulse=Math.sin(menuT*3)*.3+.7;
    X.fillStyle=`rgba(0,255,255,${pulse})`;
    X.font='14px Courier New';
    X.fillText(isMob?'TAP TO GO BACK':'ENTER TO GO BACK',W()/2,H()-45);

}
// Border vignette
function drawVignette() {
    const g=X.createRadialGradient(W()/2,H()/2,Math.min(W(),H())*.3,W()/2,H()/2,Math.max(W(),H())*.75);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,15,.5)');
    X.fillStyle=g;
    X.fillRect(0,0,W(),H());

}
// Scanlines effect (subtle)
function drawScanlines() {
    X.fillStyle='rgba(0,0,0,.03)';
    for(let y=0;y<H();y+=3)X.fillRect(0,y,W(),1);

}
function draw() {
    // Reset canvas state every frame to recover from stale drawing state / GPU compositing glitches.
    X.setTransform(DPR,0,0,DPR,0,0);
    X.globalAlpha=1;
    X.globalCompositeOperation='source-over';
    X.shadowBlur=0;
    X.shadowColor='rgba(0,0,0,0)';
    X.filter='none';
    X.textAlign='left';
    X.textBaseline='alphabetic';
    X.lineWidth=1;
    X.clearRect(0,0,W(),H());
    // Selected planetary environment forms the base layer for every game state.
    drawPlanetBackdrop();
    if(gs===ST.MENU) {
        drawMenu();
        drawVignette();
        drawScanlines();
        return
    }
    if(gs===ST.SCORES) {
        drawScores();
        drawVignette();
        drawScanlines();
        return
    }
    if(gs===ST.UPGRADE){drawUpgrade();drawVignette();drawScanlines();return;}
    X.save();
    X.translate(shake.x,shake.y);
    drawBG();
    drawGrid();
    drawGhostReplay();
    drawGW();
    drawRefs();
    drawPicks();
    drawParts();
    drawBul();
    drawEn();
    if(gs===ST.PLAY||gs===ST.PAUSE)drawP();
    drawFT();
    X.restore();
    if(gs===ST.PLAY)drawHUD();
    if(gs===ST.PAUSE) {
        drawHUD();
        drawPause()
    }
    if(gs===ST.OVER)drawOver();
    drawVignette();
    drawScanlines();

}
let lastT=0;
let frameErrorCount=0;
function loop(t) {
    // Keep the animation loop alive even if one frame hits a browser/canvas edge case.
    try {
        const dt=Math.min(33,t-lastT);
        lastT=t;
        anim++;
        update();
        draw();

    }catch(err) {
        frameErrorCount++;
        if(frameErrorCount===1 || frameErrorCount%120===0) {
            console.error('VECTOR RICOCHET frame error (count '+frameErrorCount+'):',err);

        }
        // Restore drawing state so a single bad frame cannot leave the canvas corrupted.
        try {
            X.setTransform(DPR,0,0,DPR,0,0);
            X.globalAlpha=1;
            X.globalCompositeOperation='source-over';
            X.shadowBlur=0;
            X.filter='none';
            X.clearRect(0,0,W(),H());
            X.fillStyle='#000812';
            X.fillRect(0,0,W(),H());

        }catch(recoveryError) {
            console.error('Canvas recovery error:',recoveryError)
        }
    }
    finally {
        requestAnimationFrame(loop);

    }
}
initStars();
menuParticles=[];
playerNameInput.focus();
requestAnimationFrame(loop);
    </script>
